<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riot Games — Login</title>
  <link rel="stylesheet" href="GH.css">
  <link rel="stylesheet" href="styles/animations.css">
  <link rel="stylesheet" href="styles/themes.css">
</head>
<body>

  <main>
    <section class="login" aria-label="Tela de Login Riot">
      <div class="wrapper">
        <!-- Logo Riot Games em Vetor SVG -->
        <div class="login__logo" style="display:flex; justify-content:center; margin-bottom: 60px;">
          <svg viewBox="0 0 135 45" width="135" height="45" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path fill="#EB0029" d="M14.5 0C6.5 0 0 6.5 0 14.5v16C0 38.5 6.5 45 14.5 45h16c8 0 14.5-6.5 14.5-14.5v-16C45 6.5 38.5 0 30.5 0h-16zm2.2 9.5h11.6c3.9 0 7 3.1 7 7s-3.1 7-7 7H16.7v9.5H12V9.5h4.7zm0 4.7v4.7h6.9c1.3 0 2.3-1 2.3-2.3s-1-2.3-2.3-2.3h-6.9z"/>
            <text x="50" y="32" font-family="'Lexend Deca', sans-serif" font-weight="900" font-size="28" letter-spacing="1" fill="#18181B">RIOT</text>
          </svg>
        </div>

        <h1 class="login__title">Fazer login</h1>
    
        <label class="login__label">
          <span>nome de usuário</span>
          <input type="text" name="username" class="input" autocomplete="username">
        </label>
  
        <label class="login__label">
          <span>senha</span>
          <input type="password" name="password" class="input" autocomplete="current-password">
        </label>
  
        <!-- Botões Sociais com SVGs Embutidos -->
        <div class="login__icons">
          <button type="button" class="icons__button" style="background-color: #1877F2;" title="Facebook">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="#FFFFFF"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          </button>
  
          <button type="button" class="icons__button" style="background-color: #ECECEC;" title="Google">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.11 0 9.83 0 12s.43 3.89 1.19 5.42l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.68 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
          </button>
  
          <button type="button" class="icons__button" style="background-color: #000000;" title="Apple">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="#FFFFFF"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 5.39c.65-.79 1.09-1.89.97-2.99-.94.04-2.08.63-2.75 1.42-.59.69-1.11 1.8-0.97 2.87 1.06.08 2.1-.51 2.75-1.3z"/></svg>
          </button>
        </div>
  
        <label class="login__label--checkbox">
          <input type="checkbox" class="input--checkbox">
          Manter login
        </label>
      </div>

      <div class="wrapper">
        <button type="button" class="login__button" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" style="width: 20px; fill: white;">
            <path d="M438.6 278.6l-160 160C272.4 444.9 264.2 448 256 448s-16.38-3.125-22.62-9.375c-12.5-12.5-12.5-32.75 0-45.25L338.8 288H32C14.33 288 .0016 273.7 .0016 256S14.33 224 32 224h306.8l-105.4-105.4c-12.5-12.5-12.5-32.75 0-45.25s32.75-12.5 45.25 0l160 160C451.1 245.9 451.1 266.1 438.6 278.6z"/>
          </svg>
        </button>
  
        <a href="index.html" class="login__link">não consegue iniciar sessão?</a>
        <a href="index.html" class="login__link">criar conta</a>
        <a href="bodyfit/index.html" class="login__link" style="color: #6B7280; font-size: 0.75em; margin-top: 10px;">Bodyfit Project →</a>
      </div>

    </section>

    <section class="wallpaper"></section>
  </main>

  <script src="js/audio.js"></script>
  <script src="js/mock-auth.js"></script>
  <script src="js/auth.js"></script>
  <script src="Durateston.js"></script>
</body>
</html>
